name: watch

# El bot se queda despierto de corrido durante la ventana que fijaste en
# fuentes.py (DESPIERTO).  Mientras esta despierto escucha el chat sin cortar
# y los botones contestan en un segundo.  Este reloj solo lo vuelve a
# levantar si se cayo o si termino su turno.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# OJO: esto tiene que quedar en true.  Antes estaba en false y era la causa
# de que despues de actualizar el bot siguiera contestando la version vieja:
# el turno nuevo quedaba esperando en la fila hasta 5 horas y media mientras
# el turno viejo seguia corriendo el codigo viejo.  En true, subir un cambio
# corta el turno viejo y arranca el nuevo en el momento.
concurrency:
  group: watch
  # Un turno nuevo que llega SOLO porque el reloj sono no tiene que matar al
  # que esta trabajando: si lo corta justo despues de mandarte un aviso y
  # antes de anotarlo, el aviso se repite en la vuelta siguiente.  Los turnos
  # que arrancan a mano o por un cambio de codigo SI cortan al viejo, que es
  # justo lo que hace falta al actualizar.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: instalar
        run: pip install -r requirements.txt

      - name: mirar
        env:
          SITE_A_URL: ${{ secrets.SITE_A_URL }}
          SITE_A_USER: ${{ secrets.SITE_A_USER }}
          SITE_A_PASS: ${{ secrets.SITE_A_PASS }}
          SITE_B_URL: ${{ secrets.SITE_B_URL }}
          SITE_B_USER: ${{ secrets.SITE_B_USER }}
          SITE_B_PASS: ${{ secrets.SITE_B_PASS }}
          CAL_URL: ${{ secrets.CAL_URL }}
          CAL_URL_B: ${{ secrets.CAL_URL_B }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_RAMA: ${{ github.ref_name }}
          CLAVE_COMPARTIR: ${{ secrets.CLAVE_COMPARTIR }}
          GIST_ID: ${{ secrets.GIST_ID }}
          IA_KEY: ${{ secrets.IA_KEY }}
          # Las claves de repuesto tambien tienen que llegar al programa: si
          # no se pasan aca, adentro solo existe la primera y el relevo nunca
          # ocurre, asi que al agotarse la titular se queda sin resumenes.
          IA_KEY_2: ${{ secrets.IA_KEY_2 }}
          IA_KEY_3: ${{ secrets.IA_KEY_3 }}
          IA_KEY_4: ${{ secrets.IA_KEY_4 }}
          IA_KEY_5: ${{ secrets.IA_KEY_5 }}
          IA_KEYS: ${{ secrets.IA_KEYS }}
          IA_KEY_2_PROVEEDOR: ${{ secrets.IA_KEY_2_PROVEEDOR }}
          IA_KEY_2_MODELO: ${{ secrets.IA_KEY_2_MODELO }}
          IA_KEY_2_URL: ${{ secrets.IA_KEY_2_URL }}
        run: python watcher.py

      # Si la memoria vive en el gist, esto casi nunca tiene nada que subir.
      # Queda igual como red por si el gist falla.
      #
      # OJO: la memoria trae los nombres de tus ramos, la direccion de la
      # plataforma y tus recordatorios.  En un repositorio a la vista de
      # todos eso queda publicado sin querer, asi que esta copia solo se
      # guarda cuando el repositorio es privado.  Si esta abierto al
      # publico, la memoria vive unicamente en el gist privado.
      - name: guardar la memoria de respaldo
        if: always() && github.event.repository.private
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add estado/visto.json || true
          git diff --staged --quiet || git commit -m "estado"
          git pull --rebase --autostash || true
          git push || true
